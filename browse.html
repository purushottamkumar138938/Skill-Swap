<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Skills — SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="browse.css">
</head>
<body>

<header class="site-header">
  <a href="home.html" class="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 12 C4 7, 9 4, 14 6 L14 10 L20 6 L20 14 L14 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 20 C28 25, 23 28, 18 26 L18 22 L12 26 L12 18 L18 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    SkillSwap
  </a>

  <form class="search" role="search" id="searchForm">
    <input type="search" id="searchInput" placeholder="Search a skill — guitar, Figma, Spanish…" aria-label="Search skills">
  </form>

  <nav class="nav-links">
    <a href="browse.html">Browse</a>
    <a href="login.html">Login</a>
    <a href="signup.html" class="btn btn-primary">+ List a Skill</a>
  </nav>
</header>

<section class="browse-wrap">

  <div class="browse-head">
    <h1>Browse Skills</h1>
    <p>Pick a category or search, then request a swap with someone who teaches it.</p>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filter-pill active" data-cat="All">All</button>
    <button class="filter-pill" data-cat="Tech">Tech</button>
    <button class="filter-pill" data-cat="Music">Music</button>
    <button class="filter-pill" data-cat="Art">Art</button>
    <button class="filter-pill" data-cat="Language">Language</button>
    <button class="filter-pill" data-cat="Fitness">Fitness</button>
  </div>

  <p class="result-count" id="resultCount"></p>

  <div class="skill-grid" id="skillGrid">
    <!-- filled by browse.js -->
  </div>

</section>

<footer class="site-footer">
  <span>SkillSwap — trade skills, not money.</span>
  <nav>
    <a href="about.html">About</a>
    <a href="contactus.html">Contact</a>
    <a href="browse.html">Browse Skills</a>
  </nav>
</footer>

<script src="browse.js"></script>
</body>
</html>
