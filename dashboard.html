<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<header class="site-header">
  <a href="home.html" class="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 12 C4 7, 9 4, 14 6 L14 10 L20 6 L20 14 L14 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 20 C28 25, 23 28, 18 26 L18 22 L12 26 L12 18 L18 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    SkillSwap
  </a>

  <form class="search" role="search">
    <input type="search" placeholder="Search a skill — guitar, Figma, Spanish…" aria-label="Search skills">
  </form>

  <nav class="nav-links">
    <a href="browse.html">Browse</a>
    <a href="match-finder.html">Find Matches</a>
    <a href="reviews.html">Reviews</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</header>

<section class="dash-wrap">

  <div class="dash-head">
    <h1 id="welcomeText">Welcome back</h1>
    <p>Here is a quick look at your swap activity.</p>
    <a href="match-finder.html" class="btn btn-primary">Find My Matches</a>
  </div>

  <div class="stat-row">
    <div class="stat-box">
      <span class="stat-num" id="statSent">0</span>
      <span class="stat-label">Requests Sent</span>
    </div>
    <div class="stat-box">
      <span class="stat-num" id="statReceived">0</span>
      <span class="stat-label">Requests Received</span>
    </div>
    <div class="stat-box">
      <span class="stat-num" id="statAccepted">0</span>
      <span class="stat-label">Accepted Swaps</span>
    </div>
  </div>

  <h2 class="dash-sub">Recent Swap Requests</h2>
  <div class="request-list" id="requestList">
    <!-- filled by dashboard.js -->
  </div>

  <button class="btn btn-ghost demo-btn" id="demoBtn" type="button">Load demo requests</button>

</section>

<footer class="site-footer">
  <span>SkillSwap — trade skills, not money.</span>
  <nav>
    <a href="about.html">About</a>
    <a href="contactus.html">Contact</a>
    <a href="browse.html">Browse Skills</a>
  </nav>
</footer>

<script src="dashboard.js"></script>
