<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile — SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="profile.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 12 C4 7, 9 4, 14 6 L14 10 L20 6 L20 14 L14 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 20 C28 25, 23 28, 18 26 L18 22 L12 26 L12 18 L18 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    SkillSwap
  </a>

  <form class="search" role="search">
    <input type="search" placeholder="Search a skill — guitar, Figma, Spanish…" aria-label="Search skills">
  </form>

  <nav class="nav-links">
    <a href="browse.html">Browse</a>
    <a href="match-finder.html">Find Matches</a>
    <a href="reviews.html">Reviews</a>
    <a href="login.html">Login</a>
    <a href="signup.html" class="btn btn-primary">+ List a Skill</a>
  </nav>
</header>

<section class="profile-wrap">

  <div class="profile-card">
    <div class="profile-avatar" id="profileAvatar">PK</div>
    <h1 id="profileName">Loading…</h1>
    <p class="profile-email" id="profileEmail"></p>
    <a href="edit-profile.html" class="btn btn-ghost btn-block">Edit Profile</a>
  </div>

  <div class="profile-skills">

    <h2>Skills I Teach</h2>
    <div class="skill-list" id="teachList">
      <!-- filled by profile.js -->
    </div>

    <h2>Skills I Want to Learn</h2>
    <div class="skill-list" id="learnList">
      <!-- filled by profile.js -->
    </div>

  </div>

</section>

<footer class="site-footer">
  <span>SkillSwap — trade skills, not money.</span>
  <nav>
    <a href="about.html">About</a>
    <a href="contactus.html">Contact</a>
    <a href="browse.html">Browse Skills</a>
  </nav>
</footer>

<script src="profile.js"></script>
</body>
</html>
