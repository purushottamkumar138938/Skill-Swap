<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up — SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="signup.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 12 C4 7, 9 4, 14 6 L14 10 L20 6 L20 14 L14 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 20 C28 25, 23 28, 18 26 L18 22 L12 26 L12 18 L18 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    SkillSwap
  </a>

  <form class="search" role="search">
    <input type="search" placeholder="Search a skill — guitar, Figma, Spanish…" aria-label="Search skills">
  </form>

  <nav class="nav-links">
    <a href="browse.html">Browse</a>
    <a href="login.html">Login</a>
    <a href="signup.html" class="btn btn-primary">+ List a Skill</a>
  </nav>
</header>

<section class="auth-wrap">
  <form class="auth-card" id="signupForm" novalidate>
    <span class="auth-kicker">Join the swap</span>
    <h1>Create your account</h1>
    <p class="auth-sub">List what you can teach, say what you want to learn — we'll find your match.</p>

    <div class="field">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="6" required>
    </div>

    <div class="field field-teach">
      <label for="teachSkills">Skill(s) You Can Teach</label>
      <input type="text" id="teachSkills" name="teachSkills" placeholder="e.g. Guitar, Excel" required>
    </div>

    <div class="field field-learn">
      <label for="learnSkills">Skill(s) You Want to Learn</label>
      <input type="text" id="learnSkills" name="learnSkills" placeholder="e.g. Spanish, Figma" required>
    </div>

    <p class="form-msg" id="formMsg" role="status"></p>

    <button type="submit" class="btn btn-primary btn-block">Create Account</button>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </form>
</section>

<footer class="site-footer">
  <span>SkillSwap — trade skills, not money.</span>
  <nav>
    <a href="about.html">About</a>
    <a href="contactus.html">Contact</a>
    <a href="browse.html">Browse Skills</a>
  </nav>
</footer>

<script src="signup.js"></script>
</body>
</html>
