<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews — SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reviews.css">
</head>
<body>

<header class="site-header">
  <a href="home.html" class="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 12 C4 7, 9 4, 14 6 L14 10 L20 6 L20 14 L14 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 20 C28 25, 23 28, 18 26 L18 22 L12 26 L12 18 L18 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    SkillSwap
  </a>

  <form class="search" role="search">
    <input type="search" placeholder="Search a skill — guitar, Figma, Spanish…" aria-label="Search skills">
  </form>

  <nav class="nav-links">
    <a href="browse.html">Browse</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
  </nav>
</header>

<section class="reviews-wrap">

  <div class="reviews-main">
    <h1>Reviews &amp; Ratings</h1>

    <div class="rating-summary">
      <span class="rating-big" id="avgRating">0.0</span>
      <div>
        <div class="rating" id="avgStars">☆☆☆☆☆</div>
        <p class="rating-count" id="reviewCount">0 reviews</p>
      </div>
    </div>

    <div id="reviewList">
      <!-- filled by reviews.js -->
    </div>
  </div>

  <form class="contact-card" id="reviewForm" novalidate>
    <h2>Write a Review</h2>

    <div id="formFields">
      <div class="field">
        <label for="teacherName">Who taught you?</label>
        <input type="text" id="teacherName" placeholder="e.g. Meera K." required>
      </div>

      <div class="field">
        <label for="skillName">Skill</label>
        <input type="text" id="skillName" placeholder="e.g. Spanish" required>
      </div>

      <div class="field">
        <label>Your Rating</label>
        <div class="star-picker" id="starPicker">
          <button type="button" data-value="1" aria-label="1 star">★</button>
          <button type="button" data-value="2" aria-label="2 stars">★</button>
          <button type="button" data-value="3" aria-label="3 stars">★</button>
          <button type="button" data-value="4" aria-label="4 stars">★</button>
          <button type="button" data-value="5" aria-label="5 stars">★</button>
        </div>
      </div>

      <div class="field">
        <label for="reviewText">Your Review</label>
        <textarea id="reviewText" rows="4" placeholder="How was your swap session?" required></textarea>
      </div>

      <p class="form-msg" id="formMsg" role="status"></p>

      <button type="submit" class="btn btn-primary btn-block">Submit Review</button>
    </div>
  </form>

</section>

<footer class="site-footer">
  <span>SkillSwap — trade skills, not money.</span>
  <nav>
    <a href="about.html">About</a>
    <a href="contactus.html">Contact</a>
    <a href="browse.html">Browse Skills</a>
  </nav>
</footer>

<script src="reviews.js"></script>
</body>
</html>
